<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>TERMINAL // SNAKE</title>
<style>
  
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:
      radial-gradient(1200px 700px at 50% -10%, rgba(246,70,93,.06), transparent 60%),
      linear-gradient(0deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0/100% 3px,
      var(--bg);
    color:var(--text);font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
    display:flex;flex-direction:column;align-items:center;padding:18px 12px}
  .titlebar{width:min(520px,96vw);display:flex;align-items:center;gap:10px;padding:10px 16px;
    background:linear-gradient(180deg,#16202c,#10161f);border:1px solid var(--border);border-radius:10px;margin-bottom:14px}
  .dot{width:12px;height:12px;border-radius:50%}.dot.r{background:#ff5f56}.dot.y{background:#ffbd2e}.dot.g{background:#27c93f}
  .titlebar .t{margin-left:8px;color:var(--dim);font-size:13px;letter-spacing:1px}
  .titlebar .t b{color:var(--red)}

  .status{width:min(520px,96vw);display:flex;justify-content:space-between;align-items:center;
    background:#0e141d;border:1px solid var(--border);border-radius:8px;padding:10px 16px;margin-bottom:12px}
  .status .lab{color:var(--dim);font-size:11px;letter-spacing:1px}
  .status .num{font-size:24px;font-weight:700;letter-spacing:1px}
  .status .red{color:var(--red)} .status .gold{color:var(--gold)}
  .status .col{display:flex;flex-direction:column;align-items:center;gap:2px}

  .stage{width:min(520px,96vw);display:flex;justify-content:center}
  canvas{background:#0a0e14;border:1px solid var(--border);border-radius:6px;touch-action:none;display:block;width:100%;height:auto}

  .bar{width:min(520px,96vw);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;justify-content:center}
  .act{background:#0e141d;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 16px;cursor:pointer;font-family:inherit;font-size:13px}
  .act:hover{border-color:var(--dim)}
  .act.gold{color:var(--gold);border-color:rgba(240,185,11,.4)}
  .diffbar{width:min(520px,96vw);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .diffbar button{background:#0e141d;color:var(--dim);border:1px solid var(--border);border-radius:8px;padding:6px 13px;font-weight:700;cursor:pointer;font-family:inherit;font-size:12px}
  .diffbar button.active{background:var(--gold,#f0b90b);color:#0a0e14;border-color:var(--gold,#f0b90b)}

  #overlay{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(10,14,20,.92)}
  #overlay .box{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:30px 40px;text-align:center;min-width:340px}
  #overlay h2{font-size:24px;margin-bottom:8px;letter-spacing:1px;color:var(--red)}
  #overlay .sub{color:var(--dim);font-size:12px;margin-bottom:14px}
  #overlay .score{font-size:40px;font-weight:700;color:var(--gold);margin-bottom:4px}
  #overlay .best{color:var(--dim);font-size:13px;margin-bottom:18px}
  #overlay .big{background:var(--red);color:#0a0e14;border:none;font-weight:700;padding:11px 28px;font-family:inherit;cursor:pointer;border-radius:8px;font-size:14px}
  #overlay .board{margin-top:20px;border-top:1px solid var(--border);padding-top:14px;text-align:left}
  #overlay .board-title{color:var(--gold);font-size:13px;letter-spacing:4px;font-weight:700;text-align:center;margin-bottom:2px}
  #overlay .board-sub{color:var(--dim);font-size:10px;letter-spacing:2px;text-align:center;margin-bottom:14px}
  #overlay .board ol{list-style:none;padding:0;margin:0}
  /* 入榜动画：逐条延迟滑入（staggered） */
  #overlay .board li{opacity:0;transform:translateY(14px);animation:rankIn .5s cubic-bezier(.2,.9,.3,1.15) forwards;font-family:'JetBrains Mono',Consolas,monospace}
  @keyframes rankIn{to{opacity:1;transform:none}}
  #overlay .board li:nth-child(1){animation-delay:.04s}
  #overlay .board li:nth-child(2){animation-delay:.16s}
  #overlay .board li:nth-child(3){animation-delay:.28s}
  #overlay .board li:nth-child(4){animation-delay:.40s}
  #overlay .board li:nth-child(5){animation-delay:.52s}
  /* 普通条目（2-5 名）：奖杯/序号 | 头像 | 信息 | 徽章 */
  #overlay .board li.row{display:grid;grid-template-columns:36px 32px 1fr auto;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;margin-bottom:4px;background:rgba(255,255,255,.02)}
  #overlay .board li.row .rk{font-size:18px;font-weight:700;color:var(--dim);text-align:center;letter-spacing:1px}
  #overlay .board li.row .rk.silver{color:#dcdcdc;font-size:19px;text-shadow:0 0 8px rgba(192,192,192,.55)}
  #overlay .board li.row .rk.bronze{color:#d99564;font-size:18px;text-shadow:0 0 8px rgba(205,127,50,.55)}
  /* hero 大卡（第 1 名）：大头像 + 奖杯 + 大分数 */
  #overlay .board li.hero{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;margin-bottom:8px;background:linear-gradient(90deg,rgba(240,185,11,.10),transparent 75%);box-shadow:inset 3px 0 0 var(--gold),0 0 22px rgba(240,185,11,.16)}
  #overlay .board li.hero .avatar{width:46px;height:46px;font-size:20px}
  #overlay .board li.hero .info .line2 .sc{font-size:24px;color:var(--gold);text-shadow:0 0 10px rgba(240,185,11,.5)}
  /* 头像：首字母 + 代号 hash 渐变（JS 内联算好色相，无依赖） */
  #overlay .board .avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0a0e14;font-weight:700;font-size:13px;flex:none;box-shadow:0 0 8px rgba(0,0,0,.45)}
  /* 信息区：两行（名称+段位 / 分数·用时·相对时间） */
  #overlay .board .info{min-width:0}
  #overlay .board .info .line1{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text)}
  #overlay .board .info .line1 .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
  #overlay .board .info .line1 .tier{font-size:11px;color:var(--dim);background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:4px;padding:1px 6px;letter-spacing:1px;white-space:nowrap}
  #overlay .board .info .line2{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-top:2px;flex-wrap:wrap}
  #overlay .board .info .line2 .sc{font-size:15px;font-weight:700;color:var(--text);letter-spacing:1px}
  #overlay .board .info .line2 .dot{opacity:.35}
  #overlay .board li .badge{font-size:9px;font-weight:700;letter-spacing:1px;background:var(--red);color:#0a0e14;padding:2px 6px;border-radius:3px}
  /* 当前玩家：霓虹红框 + 外发光 */
  #overlay .board li.mine{box-shadow:inset 0 0 0 1px var(--red),0 0 18px rgba(246,70,93,.5),inset 0 0 14px rgba(246,70,93,.08);background:rgba(246,70,93,.07)}
  #overlay .board li.mine .info .line1 .name{color:var(--red);text-shadow:0 0 10px rgba(246,70,93,.6)}
  #overlay .board li.mine .info .line2 .sc{color:var(--red);text-shadow:0 0 10px rgba(246,70,93,.5)}
  /* 空榜占位（禁用入场动画） */
  #overlay .board-empty{padding:24px 12px;text-align:center;color:var(--dim);font-size:12px;line-height:1.9;display:block;opacity:1;transform:none;animation:none;border:1px dashed var(--border);border-radius:8px;margin-top:4px}
  #overlay .board-empty .hint{color:var(--gold);font-size:13px;letter-spacing:3px;margin-bottom:8px;font-weight:700;text-shadow:0 0 8px rgba(240,185,11,.5)}
  /* 新纪录全屏文字彩蛋 */
  #recFlash{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%) scale(.6);z-index:2147483001;color:var(--gold);font:700 32px 'JetBrains Mono',Consolas,monospace;letter-spacing:2px;text-shadow:0 0 20px rgba(240,185,11,.85),0 0 60px rgba(240,185,11,.4);pointer-events:none;animation:recPop 1.7s ease-out forwards;white-space:nowrap}
  @keyframes recPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}28%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.06)}}

  #tip{width:min(520px,96vw);color:var(--dim);font-size:12px;margin-top:10px;text-align:center;line-height:1.6}
</style>
</head>
<body>
  <div class="titlebar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="t">TERMINAL // <b>SNAKE</b> · 贪吃蛇</span>
  </div>

  <div class="status">
    <div class="col"><span class="lab">SCORE</span><span class="num red" id="score">0</span></div>
    <div class="col"><span class="lab">BEST</span><span class="num gold" id="best">0</span></div>
    <div class="col"><span class="lab">SPEED</span><span class="num" id="spd">1.0x</span></div>
  </div>

  <div class="stage">
    <canvas id="cv" width="400" height="400"></canvas>
  </div>

  <div class="bar">
    <button class="act" id="pauseBtn">⏸ 暂停 (空格)</button>
    <button class="act gold" id="newBtn">↻ 新局</button>
  </div>

  <div id="tip">方向键 / WASD 转向 · 空格 / P 暂停 · 手机滑动转向 · 吃 ⚡加速 / 🛡护盾 / 💎宝石 · 撞墙或撞到自己即结束</div>

  <div class="diffbar" id="diffbar"></div>

  <div id="overlay">
    <div class="box">
      <h2>GAME OVER</h2>
      <div class="sub" id="goSub">SESSION TERMINATED</div>
      <div class="score" id="goScore">0</div>
      <div class="best">BEST <span id="goBest">0</span></div>
      <div class="board">
        <div class="board-title">LOCAL LEADERBOARD</div>
        <div class="board-sub">TOP 5 · 本地最高分</div>
        <ol id="top5List"></ol>
      </div>
      <button class="big" id="goBtn">新 局</button>
    </div>
  </div>

<script src="common.js"></script>
<script>Common.injectTheme();</script>
<script src="input.js"></script>
<script src="juice.js"></script>
<script>
(function(){
  "use strict";
  var GRID = 20;
  var CELL = 20;                 // canvas 400 / 20
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');

  var scoreEl = document.getElementById('score');
  var bestEl  = document.getElementById('best');
  var spdEl   = document.getElementById('spd');
  var pauseBtn= document.getElementById('pauseBtn');
  var newBtn  = document.getElementById('newBtn');
  var overlay = document.getElementById('overlay');
  var goScore = document.getElementById('goScore');
  var goBest  = document.getElementById('goBest');
  var goSub   = document.getElementById('goSub');
  var goBtn   = document.getElementById('goBtn');


  // 局部种子 PRNG（mulberry32）：注入代码里的随机必须走它，禁止 Math.random，
  // 以免污染 node 测试 harness 跨游戏共享的 Math.random 流。
  function mk(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var _rng = mk(0x5EED ^ (GRID*2654435761));
  function reseed(s){ _rng = mk((s>>>0) || 1); }

  var snake, dir, nextDir, food, score, best, alive, paused, level;
  var _myTopRank = 0;   // 本局在本地排行榜的名次（0=未上榜），用于结束浮层高亮
  var _startMs = 0;     // 本局开始时间戳（nowMs），用于排行榜"用时"字段
  var powerups=[], boostUntil=0, shieldUntil=0;
  var stepMs, acc, lastT, raf;

  // ---------- 难度系统（简单/普通/困难/地狱）----------
  // stepMult=步进间隔倍率（越小越快越难）；越大越慢越简单。normal=1.0 保基线
  var BASE_STEP = 140;
  var DIFFICULTY = {
    easy:   { label:'简单', stepMult:1.35 },
    normal: { label:'普通', stepMult:1.0 },
    hard:   { label:'困难', stepMult:0.75 },
    hell:   { label:'地狱', stepMult:0.55 }
  };
  var DIFF_ORDER = ['easy','normal','hard','hell'];
  var difficulty = 'normal';
  function setDifficulty(d){ if(DIFFICULTY[d]){ difficulty=d; return true; } return false; }
  function getDifficulty(){ return difficulty; }
  function diffCfg(){ return DIFFICULTY[difficulty] || DIFFICULTY.normal; }
  let _confettiFired = false;   // 只读钩子：分数里程碑庆祝是否已触发（仅一次）
  const J = (typeof Juice !== 'undefined') ? Juice : null;

  function nowMs(){ return (typeof performance!=='undefined' && performance.now) ? performance.now() : 0; }

  try { best = parseInt(Common.Storage.get('snake','best',0) || '0', 10) || 0; } catch(e) { best = 0; }
  bestEl.textContent = best;

  function reset(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    level = 0;
    stepMs = Math.round(BASE_STEP * diffCfg().stepMult);
    acc = 0;
    lastT = 0;
    alive = true;
    paused = false;
    powerups = [];
    boostUntil = 0;
    shieldUntil = 0;
    _confettiFired = false;
    _myTopRank = 0;
    _startMs = nowMs();
    reseed(0x5EED ^ (GRID*2654435761));
    spawnFood();
    overlay.style.display = 'none';
    pauseBtn.textContent = '⏸ 暂停 (空格)';
    updateHud();
  }

  function updateHud(){
    scoreEl.textContent = score;
    bestEl.textContent = best;
    spdEl.textContent = (140/stepMs).toFixed(1) + 'x';
  }

  function occupied(x,y){
    for(var i=0;i<snake.length;i++){ if(snake[i].x===x && snake[i].y===y) return true; }
    return false;
  }

  function spawnFood(){
    var free = [];
    for(var y=0;y<GRID;y++){
      for(var x=0;x<GRID;x++){
        if(!occupied(x,y)) free.push({x:x,y:y});
      }
    }
    if(free.length===0){ food=null; return; }   // win-ish: board full
    food = Common.pick(free, _rng);
    if(_rng() < 0.18) spawnPowerup();
  }

  // 在空格随机掉落一个道具（最多同时存在 2 个，不与食物/蛇身重叠）
  function spawnPowerup(){
    if(powerups.length >= 2) return;
    var free = [];
    for(var y=0;y<GRID;y++){
      for(var x=0;x<GRID;x++){
        if(!occupied(x,y) && !(food && food.x===x && food.y===y)) free.push({x:x,y:y});
      }
    }
    if(free.length===0) return;
    var cell = Common.pick(free, _rng);
    var types = ['speed','shield','gem'];
    powerups.push({ x:cell.x, y:cell.y, type:Common.pick(types, _rng) });
  }

  // 标准掉落构造器（供 hook 直接投放）
  function makePickup(type, x, y){ return { x:x, y:y, type:type }; }

  // 拾取道具：返回 true 表示蛇身应增长一格（仅宝石）
  function applyPower(type, x, y){
    var px = x*CELL+CELL/2, py = y*CELL+CELL/2;
    if(typeof Juice!=='undefined'){ Juice.sfx('pickup'); Juice.burst(px, py, {color:'#f0b90b', n:8, speed:160}); }
    if(type==='speed'){
      boostUntil = nowMs() + 5000;
      if(typeof Juice!=='undefined'){ Juice.popup(px, py, '⚡', '#f6465d', {size:16}); Juice.achievement('⚡ 加速 5s'); }
      return false;
    } else if(type==='shield'){
      shieldUntil = nowMs() + 4000;
      if(typeof Juice!=='undefined'){ Juice.popup(px, py, '🛡', '#02c076', {size:16}); Juice.achievement('🛡 护盾 4s'); }
      return false;
    } else { // gem：大幅加分并增长
      score += 5;
      if(score > best){ best = score; try { Common.Storage.set('snake','best',best); } catch(e){} }
      if(typeof Juice!=='undefined') Juice.popup(px, py, '+5', '#f0b90b', {size:16});
      updateHud();
      return true;
    }
  }

  function setDir(nx,ny){
    // cannot reverse directly into self
    if(snake.length>1 && nx===-dir.x && ny===-dir.y) return;
    nextDir = {x:nx,y:ny};
  }

  function step(){
    dir = nextDir;
    var head = snake[0];
    var nx = head.x + dir.x;
    var ny = head.y + dir.y;
    var ghost = nowMs() < shieldUntil;   // 护盾：可穿墙 + 穿身

    // wall：护盾状态下环绕穿过，否则结束
    if(nx<0 || ny<0 || nx>=GRID || ny>=GRID){
      if(ghost){ nx=(nx+GRID)%GRID; ny=(ny+GRID)%GRID; }
      else return gameOver();
    }
    // self collision：护盾状态下允许穿过自身
    if(occupied(nx,ny) && !ghost){ return gameOver(); }

    snake.unshift({x:nx,y:ny});

    // 道具拾取
    var ate = false;
    for(var pi=powerups.length-1; pi>=0; pi--){
      if(powerups[pi].x===nx && powerups[pi].y===ny){
        if(applyPower(powerups[pi].type, nx, ny)) ate = true;
        powerups.splice(pi,1);
        break;
      }
    }

    if(food && nx===food.x && ny===food.y){
      var fx = nx*CELL+CELL/2, fy = ny*CELL+CELL/2;
      score += 1;
      ate = true;
      Juice.sfx('pickup');
      Juice.popup(fx, fy, '+1', '#02c076');
      Juice.burst(fx, fy, {color:'#02c076', n:6, speed:140});
      if(score % 4 === 0 && level < 8){   // ramp speed, capped
        level += 1;
        stepMs = Math.round(Math.max(60, 140 - level*10) * diffCfg().stepMult);
        Juice.sfx('levelup');
        Juice.achievement('加速 → '+(140/stepMs).toFixed(1)+'x');
      }
      if(score > best){ best = score; try { Common.Storage.set('snake','best',best); } catch(e){} }
      spawnFood();
      updateHud();
      if(score>=10 && !_confettiFired){ _confettiFired = true; if(J&&J.confetti) J.confetti(window.innerWidth/2, window.innerHeight*0.3, {n:120, life:2.4}); }
    }
    if(!ate) snake.pop();
  }

  // 玩家代号 / 头像底色 / 段位 / 相对时间 —— 统一走 Common.HighScores（共享数据层，见 common.js）。
  // 本地仅保留游戏计时 _startMs（纯游戏逻辑，不动）。

  // 用时 mm:ss
  function fmtDur(ms){
    if(!ms) return '--:--';
    var s = Math.floor(ms/1000);
    return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2);
  }

  // 写入本地排行榜：委托 Common.HighScores（key='snake'）。返回本次名次（1-5=上榜）。
  // 玩家代号 / 头像色相 / 段位 / 相对时间等全部走共享工具，避免游戏文件裸存储与重复实现。
  function addTop5(s){
    if(!(s > 0)) return 0;
    return Common.HighScores.record('snake', s, (nowMs() - _startMs) || 0);
  }

  // 渲染排行榜到结束浮层 #top5List：第 1 名 hero 大卡（头像/🥇/段位/用时/相对时间），
  // 2-5 名紧凑条（🥈🥉/序号）；当前玩家行霓虹高亮 + [ME] 徽章。无 DOM 环境静默跳过。
  function renderTop5(){
    try {
      var box = document.getElementById('top5List');
      if(!box) return;
      var list = Common.HighScores.read('snake');
      if(list.length === 0){
        box.innerHTML = '<li class="board-empty"><div class="hint">👑 NO RECORDS YET</div>暂无记录 · 来一局<br>你的分数将占榜首</li>';
        return;
      }
      var html = '';
      for(var i=0;i<list.length;i++){
        var rec = list[i], rank = i+1;
        var user = rec.user || 'PLAYER';
        var hue = Common.HighScores.avatarHue(user);
        var tier = Common.HighScores.tierOf(rec.score);
        var dur = fmtDur(rec.dur);
        var rt = Common.HighScores.relTime(rec.ts || (rec.date ? new Date(rec.date+'T00:00:00').getTime() : 0));
        var mine = (_myTopRank > 0 && rank === _myTopRank);
        var badge = mine ? '<span class="badge">[ME]</span>' : '';
        var avatar = '<div class="avatar" style="background:linear-gradient(135deg,hsl('+hue+',72%,52%),hsl('+((hue+40)%360)+',72%,38%))">'+user.charAt(0)+'</div>';
        var line2 = '<div class="line2"><span class="sc">'+rec.score+'</span><span class="dot">·</span><span class="dur">'+dur+'</span><span class="dot">·</span><span class="rt">'+rt+'</span></div>';
        if(rank === 1){
          html += '<li class="hero'+(mine?' mine':'')+'">'
            + avatar
            + '<div class="info"><div class="line1"><span style="font-size:20px">🥇</span><span class="name">'+user+'</span><span class="tier">'+tier.e+' '+tier.n+'</span></div>'
            + line2 + '</div>' + badge + '</li>';
        } else {
          var cup = rank===2 ? '🥈' : (rank===3 ? '🥉' : rank);
          var cupCls = rank===2 ? 'silver' : (rank===3 ? 'bronze' : '');
          html += '<li class="row'+(mine?' mine':'')+'">'
            + '<span class="rk'+cupCls+'">'+cup+'</span>'
            + avatar
            + '<div class="info"><div class="line1"><span class="name">'+user+'</span><span class="tier">'+tier.e+' '+tier.n+'</span></div>'
            + line2 + '</div>' + badge + '</li>';
        }
      }
      box.innerHTML = html;
    } catch(e) { /* 静默：不阻断游戏流程 */ }
  }

  // 新纪录全屏文字彩蛋（1.8s 后自动移除；无 DOM 环境静默）
  function flashNewRecord(){
    try {
      if(typeof document==='undefined' || !document.createElement) return;
      var el = document.createElement('div');
      el.id = 'recFlash';
      el.textContent = '🏆 NEW RECORD ' + score + '!';
      (document.body || document.documentElement).appendChild(el);
      setTimeout(function(){ if(el && el.parentNode) el.parentNode.removeChild(el); }, 1800);
    } catch(e) { /* 静默 */ }
  }

  function gameOver(){
    alive = false;
    if(score > best){ best = score; try { Common.Storage.set('snake','best',best); } catch(e){} }
    var rk = Juice.rank(score);
    Juice.sfx('lose');
    Juice.addTrauma(0.5);
    Juice.flash('#f6465d', 0.35);
    _myTopRank = addTop5(score);
    var isNewBest = (score > 0 && score >= best);
    if(isNewBest && _myTopRank > 0){ Juice.achievement('🏆 新纪录 '+score+'！本地榜第 '+_myTopRank+' 名'); flashNewRecord(); }
    else if(_myTopRank > 0){ Juice.achievement('📊 进入本地排行榜 第 '+_myTopRank+' 名'); }
    else if(isNewBest){ Juice.achievement('🏆 新纪录 '+score+'！段位 '+rk); flashNewRecord(); }
    updateHud();
    goScore.textContent = score;
    goBest.textContent = best;
    goSub.textContent = (score>=best && score>0) ? ('NEW HIGH SCORE · 段位 '+rk) : ('SESSION TERMINATED · 段位 '+rk);
    renderTop5();
    overlay.style.display = 'flex';
  }

  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.fillStyle = '#0a0e14';
    ctx.fillRect(0,0,cv.width,cv.height);
    Juice.begin(ctx);

    // grid lines
    ctx.strokeStyle = 'rgba(31,42,56,0.6)';
    ctx.lineWidth = 1;
    for(var i=1;i<GRID;i++){
      var p = i*CELL + 0.5;
      ctx.beginPath(); ctx.moveTo(p,0); ctx.lineTo(p,cv.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,p); ctx.lineTo(cv.width,p); ctx.stroke();
    }

    // food (gold) with glow
    if(food){
      ctx.save();
      ctx.shadowColor = '#f0b90b';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#f0b90b';
      roundRect(food.x*CELL+3, food.y*CELL+3, CELL-6, CELL-6, 4);
      ctx.fill();
      ctx.restore();
    }

    // 道具（带辉光 + 符号）
    for(var k=0;k<powerups.length;k++){
      var p = powerups[k];
      var pcol = p.type==='speed' ? '#f6465d' : (p.type==='shield' ? '#02c076' : '#f0b90b');
      var psym = p.type==='speed' ? '⚡' : (p.type==='shield' ? '🛡' : '💎');
      ctx.save();
      ctx.shadowColor = pcol; ctx.shadowBlur = 12; ctx.fillStyle = pcol;
      roundRect(p.x*CELL+3, p.y*CELL+3, CELL-6, CELL-6, 4);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#0a0e14';
      ctx.font = 'bold 12px JetBrains Mono, monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(psym, p.x*CELL+CELL/2, p.y*CELL+CELL/2+1);
    }

    // 当前激活的增益（左上角）
    var by = 8;
    if(nowMs() < boostUntil){ drawBuff('⚡', '#f6465d', by); by += 20; }
    if(nowMs() < shieldUntil){ drawBuff('🛡', '#02c076', by); by += 20; }

    // snake body (green) + head (red)：渐变 + 对比描边 + 顶部高光
    for(var j=snake.length-1;j>=0;j--){
      var s = snake[j];
      var isHead = (j===0);
      var base = isHead ? '#f6465d' : '#02c076';
      var lite = isHead ? '#ff7b72' : '#3fdf9a';
      var x0 = s.x*CELL+2, y0 = s.y*CELL+2, w = CELL-4, h = CELL-4;
      ctx.shadowBlur = 0;
      if(isHead){ ctx.shadowColor = 'rgba(246,70,93,0.5)'; ctx.shadowBlur = 10; }
      var grad = ctx.createLinearGradient(x0, y0, x0, y0+h);
      grad.addColorStop(0, lite);
      grad.addColorStop(1, base);
      ctx.fillStyle = grad;
      roundRect(x0, y0, w, h, 4);
      ctx.fill();
      ctx.shadowBlur = 0;
      // 对比描边
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      roundRect(x0, y0, w, h, 4);
      ctx.stroke();
      // 顶部高光
      ctx.fillStyle = 'rgba(255,255,255,0.30)';
      roundRect(x0+2, y0+2, w-4, 3, 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    Juice.mid(ctx);
    Juice.end(ctx);

    if(paused && alive){
      ctx.fillStyle = 'rgba(10,14,20,0.7)';
      ctx.fillRect(0,0,cv.width,cv.height);
      ctx.fillStyle = '#e6edf3';
      ctx.font = '700 26px JetBrains Mono, monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('PAUSED', cv.width/2, cv.height/2);
    }
  }

  function roundRect(x, y, w, h, r) {
    Common.roundRect(ctx, x, y, w, h, r);
  }

  function drawBuff(sym, col, y){
    ctx.save();
    ctx.fillStyle = col;
    ctx.font = 'bold 14px JetBrains Mono, monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(sym, 8, y);
    ctx.restore();
  }

  var loop = Common.Loop(function (t) {
  var dt = lastT ? Math.min(0.05,(t-lastT)/1000) : 0.016;
    Juice.update(dt);
    readInput();
    if(!alive || paused){ lastT = t; draw(); if(typeof Input!=='undefined') Input.update(); return; }
    if(!lastT) lastT = t;
    acc += (t - lastT);
    lastT = t;
    var ms = (nowMs() < boostUntil) ? Math.max(45, stepMs*0.55) : stepMs;
    while(acc >= ms){
      acc -= ms;
      step();
      if(!alive) break;
    }
    draw();
    if(typeof Input!=='undefined') Input.update();
});

  function togglePause(){
    if(!alive) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '▶ 继续 (空格)' : '⏸ 暂停 (空格)';
  }

  // ---- input (共享输入层 input.js：失焦清键 + 快速点按缓冲，修复断触) ----
  if (typeof Input !== 'undefined') {
    Input.init({ keymap: { 'Space':'pause', 'KeyP':'pause' } });
  }
  function readInput(){
    if (typeof Input === 'undefined') return;
    if (Input.pressed('pause')) togglePause();
    if (alive && !paused){
      if(Input.pressed('up')) setDir(0,-1);
      else if(Input.pressed('down')) setDir(0,1);
      else if(Input.pressed('left')) setDir(-1,0);
      else if(Input.pressed('right')) setDir(1,0);
    }
  }

  // swipe steering
  var tsx=0, tsy=0, tracking=false;
  cv.addEventListener('touchstart', function(e){
    var t = e.changedTouches[0];
    tsx = t.clientX; tsy = t.clientY; tracking = true;
    e.preventDefault();
  }, {passive:false});
  cv.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
  cv.addEventListener('touchend', function(e){
    if(!tracking) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - tsx, dy = t.clientY - tsy;
    if(Math.abs(dx)<20 && Math.abs(dy)<20){ tracking=false; return; }
    if(Math.abs(dx) > Math.abs(dy)){ setDir(dx>0?1:-1, 0); }
    else { setDir(0, dy>0?1:-1); }
    tracking = false;
    e.preventDefault();
  }, {passive:false});

  pauseBtn.addEventListener('click', togglePause);
  newBtn.addEventListener('click', reset);
  goBtn.addEventListener('click', reset);

  function buildDiffBar(){
    // T-121：委托共享核心（四档键与本项目 DIFFICULTY 一致）；bar.set 同步当前档位高亮
    var bar = Common.buildDiffBar('#diffbar', function(d){ setDifficulty(d); reset(); });
    if (bar) bar.set(difficulty);
  }
  buildDiffBar();

  reset();
  raf = loop.start();

  // 测试钩子（不影响正常玩法）
  window.__t = {
    GRID,
    DIFFICULTY, setDifficulty, getDifficulty, getStepMs(){ return stepMs; },
    reset, step, spawnFood, spawnPowerup, applyPower, occupied, setDir, nowMs, makePickup, draw,
    // —— 标准掉落钩子（别名 / 扩展）——
    spawnPickup(type, x, y) { powerups.push(makePickup(type, x, y)); },
    applyPickup(type, x, y) { return applyPower(type, x, y); },
    getPickups() { return powerups.map(p => ({ x:p.x, y:p.y, type:p.type })); },
    stepPickups() { /* 网格静态道具：无移动逻辑 */ },
    setShield(v) { shieldUntil = v ? nowMs() + 1e9 : 0; },
    setBoost(v) { boostUntil = v ? nowMs() + 1e9 : 0; },
    getState() { return {
      score: score, alive: alive,
      boost: nowMs() < boostUntil, shield: nowMs() < shieldUntil,
      snake: snake.map(p => ({ x: p.x, y: p.y })),
      food: food ? { x: food.x, y: food.y } : null,
      powerups: powerups.map(p => ({ x: p.x, y: p.y, type: p.type }))
    }; },
    setSnake(arr) { snake = arr.map(p => ({ x: p.x, y: p.y })); },
    setFood(obj) { food = obj ? { x: obj.x, y: obj.y } : null; },
    setPowerups(arr) { powerups = (arr||[]).map(p => ({ x:p.x, y:p.y, type:p.type })); },
    getPowerups() { return powerups.map(p => ({ x:p.x, y:p.y, type:p.type })); },
    getSnake() { return snake.map(p => ({ x: p.x, y: p.y })); },
    getFood() { return food ? { x: food.x, y: food.y } : null; },
    getScore() { return score; },
    recordScore(s) { return addTop5(s); },
    getTop5() { try { return Common.Storage.get('snake','top5',[]); } catch(e){ return []; } },
    getMyRank() { return _myTopRank; },
    clearTop5() { try { Common.Storage.set('snake','top5',[]); return true; } catch(e){ return false; } },
    getAlive() { return alive; },
    getBoost() { return nowMs() < boostUntil; },
    getShield() { return nowMs() < shieldUntil; },
    getDir() { return { x: dir.x, y: dir.y }; },
    confettiFired: () => _confettiFired
  };
})();
</script>
