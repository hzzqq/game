<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TERMINAL // GAME HUB</title>
<style>
  
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(246,70,93,.08), transparent 60%),
      linear-gradient(0deg, rgba(255,255,255,.02) 1px, transparent 1px) 0 0/100% 3px,
      var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
  }
  .window{
    width:min(1000px,100%);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:0 0 40px rgba(0,0,0,.6), 0 0 0 1px rgba(246,70,93,.08);
    overflow:hidden;
  }
  .titlebar{
    display:flex; align-items:center; gap:10px;
    padding:12px 16px;
    background:linear-gradient(180deg,#16202c,#10161f);
    border-bottom:1px solid var(--border);
  }
  .dot{width:12px;height:12px;border-radius:50%}
  .dot.r{background:#ff5f56}.dot.y{background:#ffbd2e}.dot.g{background:#27c93f}
  .titlebar .t{margin-left:8px;color:var(--dim);font-size:13px;letter-spacing:1px}
  .titlebar .t b{color:var(--red)}
  .body{padding:28px}
  h1{
    font-size:30px; letter-spacing:2px; margin-bottom:6px;
    text-shadow:0 0 18px rgba(246,70,93,.35);
  }
  .sub{color:var(--dim); font-size:13px; margin-bottom:18px; line-height:1.7}
  /* ---------- 筛选条 ---------- */
  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; align-items:center}
  .chip{
    background:#0e141d; border:1px solid var(--border); color:var(--dim);
    padding:8px 16px; border-radius:999px; cursor:pointer; font-family:inherit;
    font-size:13px; letter-spacing:.5px; transition:.16s ease; user-select:none;
  }
  .chip:hover{border-color:var(--dim); color:var(--text)}
  .chip.active{background:#16202c; color:var(--text); border-color:var(--red)}
  .chip.gold.active{color:var(--gold); border-color:var(--gold); box-shadow:0 0 16px rgba(240,185,11,.25)}
  .chip .badge{display:inline-block; margin-left:6px; font-size:10px; color:var(--gold);
    border:1px solid rgba(240,185,11,.45); border-radius:4px; padding:1px 5px; vertical-align:middle}
  .count{margin-left:auto; color:var(--dim); font-size:12px}
  .search{
    background:#0e141d; border:1px solid var(--border); color:var(--text);
    padding:8px 14px; border-radius:999px; font-family:inherit; font-size:13px;
    flex:1; min-width:150px; outline:none; transition:.16s ease;
  }
  .search:focus{ border-color:var(--red); box-shadow:0 0 0 2px rgba(246,70,93,.15); }
  .search::placeholder{ color:var(--dim); }
  a.card.played::after{content:'●';position:absolute;top:10px;left:10px;color:var(--green);font-size:9px;text-shadow:0 0 6px rgba(2,192,118,.7);z-index:2}
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px}
  @media(max-width:680px){.grid{grid-template-columns:1fr}
    .filters{position:sticky; top:6px; z-index:6; background:var(--panel);
      padding:8px; border:1px solid var(--border); border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,.4)}
    .search{flex:1 1 100%}
  }
  a.card{
    display:block; text-decoration:none; color:var(--text);
    background:#0e141d; border:1px solid var(--border); border-radius:10px;
    padding:20px; position:relative; overflow:hidden;
    transition:.18s ease;
  }
  a.card::before{
    content:""; position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(246,70,93,.12), transparent 55%);
    opacity:0; transition:.18s ease;
  }
  a.card:hover{transform:translateY(-3px); border-color:var(--red);
    box-shadow:0 0 22px rgba(246,70,93,.35)}
  a.card:hover::before{opacity:1}
  .tag{display:inline-block; font-size:11px; color:var(--gold);
    border:1px solid rgba(240,185,11,.4); border-radius:4px; padding:2px 8px; margin-bottom:12px}
  .tag.multi{color:var(--green); border-color:rgba(2,192,118,.45)}
  .card h2{font-size:20px; letter-spacing:1px; margin-bottom:8px}
  .card .desc{color:var(--dim); font-size:13px; line-height:1.6}
  .card .key{margin-top:14px; font-size:12px; color:var(--green)}
  .newflag{position:absolute; top:10px; right:-30px; transform:rotate(38deg);
    background:var(--gold); color:#0a0e14; font-size:10px; font-weight:700;
    padding:3px 32px; letter-spacing:1px; box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .foot{margin-top:26px; color:var(--dim); font-size:12px; text-align:center;
    border-top:1px dashed var(--border); padding-top:16px}
  .blink{color:var(--red); animation:bl 1.1s steps(2) infinite}
  @keyframes bl{50%{opacity:0}}
  a.card.hide{display:none}
  .sortsel{background:#0e141d; border:1px solid var(--border); color:var(--dim);
    padding:8px 14px; border-radius:999px; font-family:inherit; font-size:13px; outline:none; cursor:pointer}
  .sortsel:focus{border-color:var(--red); box-shadow:0 0 0 2px rgba(246,70,93,.15)}
  a.card .star{position:absolute; top:8px; right:10px; z-index:3; cursor:pointer;
    color:var(--dim); font-size:16px; line-height:1; transition:.15s ease; user-select:none}
  a.card .star.on{color:var(--gold); text-shadow:0 0 8px rgba(240,185,11,.6)}
  .chip.off{opacity:.6; border-color:var(--border); color:var(--dim)}
  .chip.off:hover{border-color:var(--dim)}
  .topbtn{position:fixed; right:22px; bottom:22px; z-index:50; width:46px; height:46px;
    border-radius:50%; border:1px solid var(--border); background:#0e141d; color:var(--gold);
    font-size:22px; line-height:1; cursor:pointer; box-shadow:0 6px 22px rgba(0,0,0,.45);
    opacity:0; transform:translateY(14px) scale(.9); pointer-events:none; transition:.22s cubic-bezier(.2,1.3,.4,1)}
  .topbtn.show{opacity:1; transform:none; pointer-events:auto}
  .topbtn:hover{filter:brightness(1.2); border-color:var(--gold)}
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="t">TERMINAL // <b>GAME HUB</b> · 游戏大厅</span>
    </div>
    <div class="body">
      <h1>游戏大厅</h1>
      <div class="sub">
        仿 GitHub 热门开源游戏 · 暗色金融终端风 · 红涨绿跌配色<br/>
        全部为单页 HTML5 游戏，点击即玩，无需联网。
      </div>
      <div class="filters">
        <button class="chip active" data-f="all">全部</button>
        <button class="chip" data-f="solo">单人</button>
        <button class="chip gold" data-f="multi">多人 <span class="badge">+5 NEW</span></button>
        <button class="chip" data-f="net">联机</button>
        <button class="chip" data-f="recent">最近</button>
        <button class="chip" data-f="fav">★ 收藏</button>
        <input id="search" class="search" type="text" placeholder="🔍 搜索游戏名 / 关键词…" autocomplete="off">
        <button class="chip" id="rnd" title="随机玩一款">🎲 随机</button>
        <select id="sort" class="sortsel" title="排序方式">
          <option value="def">排序:默认</option>
          <option value="name">名称 A-Z</option>
          <option value="tag">标签分组</option>
        </select>
        <button class="chip" id="mute" title="全局音效开关">🔊 音效</button>
        <button class="chip" id="setBtn" title="大厅设置">⚙ 设置</button>
        <button class="chip" id="achBtn" title="成就图鉴">🏆 成就</button>
        <span class="count" id="count"></span>
      </div>
      <div class="grid" id="grid"></div>
<script src="common.js"></script>
<script>Common.injectTheme();</script>
<script src="catalog.js"></script>
<script>
(function(){
  var grid=document.getElementById('grid');
  var list=window.GAME_CATALOG||[];
  for(var i=0;i<list.length;i++){
    var e=list[i];
    var a=document.createElement('a');
    a.className='card';
    a.setAttribute('data-cat', e.cat);
    a.setAttribute('href', e.file);
    if(e.html) a.innerHTML=e.html;
    grid.appendChild(a);
  }
})();
</script>
      <div class="foot">
        WORKBUDDY · 软件工程实训 · 选择一个游戏开始 <span class="blink">_</span>
        &nbsp;·&nbsp;<a href="tests/runner.html" style="color:var(--gold);text-decoration:none">🧪 自动检测面板</a>
        &nbsp;·&nbsp;<span id="totCount" style="color:var(--dim)"></span>
      </div>
    </div>
  </div>
  <button id="top" class="topbtn" title="回到顶部" aria-label="回到顶部">↑</button>
  <style>
  .modal-overlay{position:fixed;inset:0;background:rgba(10,14,20,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal-overlay.show{display:flex}
  .modal-box{background:#121821;border:1px solid #1f2a38;border-radius:14px;max-width:520px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .18s ease}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal-box h3{margin:0;padding:18px 20px 6px;font-size:20px;color:#e6edf3}
  .modal-box .mbody{padding:6px 20px 16px;color:#9fb0c3;font-size:13px;line-height:1.7}
  .modal-box .mbody .ops{margin:10px 0;color:#f0b90b}
  .modal-box .mrow{display:flex;align-items:center;justify-content:space-between;padding:11px 20px;border-top:1px solid #1f2a38}
  .modal-box .mrow span{color:#cdd9e5}
  .modal-box .mbtns{padding:14px 20px 20px;display:flex;gap:10px;justify-content:flex-end}
  .modal-box .play{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
  .modal-box .ghost{background:#1f2a38;color:#cdd9e5;border:none;padding:10px 16px;border-radius:10px;cursor:pointer}
  .modal-box .ach-group{margin:6px 0 12px}
  .modal-box .ach-group>b{color:#02c076}
  .modal-box .ach-item{display:flex;gap:8px;align-items:baseline;padding:4px 0;color:#9fb0c3}
  .modal-box .ach-item .a{color:#f0b90b;font-weight:700}
  .modal-box input[type=range]{accent-color:#f0b90b}
  .switch{position:relative;width:44px;height:24px;background:#1f2a38;border-radius:14px;cursor:pointer;transition:.2s;flex:0 0 auto}
  .switch.on{background:#02c076}
  .switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;background:#e6edf3;border-radius:50%;transition:.2s}
  .switch.on i{left:23px;background:#0a0e14}
  body.reduced-motion *{animation:none!important;transition:none!important}
  body.no-anim .card:hover{transform:none!important}
  .card.kfocus{outline:2px solid #f0b90b;outline-offset:2px}
  </style>
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box">
      <h3 id="dmTitle"></h3>
      <div class="mbody"><div id="dmDesc"></div><div class="ops" id="dmOps"></div></div>
      <div class="mbtns"><button class="ghost" id="dmClose">关闭</button><a class="play" id="dmPlay">▶ 开始游戏</a></div>
    </div>
  </div>
  <div class="modal-overlay" id="setModal">
    <div class="modal-box">
      <h3>⚙ 大厅设置</h3>
      <div class="mrow"><span>减弱动效 (Reduce Motion)</span><div class="switch" id="swRM"></div></div>
      <div class="mrow"><span>界面动画</span><div class="switch" id="swAnim"></div></div>
      <div class="mrow"><span>默认音量</span><input type="range" id="volRange" min="0" max="100" value="70"></div>
      <div class="mbtns"><button class="ghost" id="setClose">完成</button></div>
    </div>
  </div>
  <div class="modal-overlay" id="achModal">
    <div class="modal-box">
      <h3>🏆 成就图鉴</h3>
      <div class="mbody" id="achBody"></div>
      <div class="mbtns"><button class="ghost" id="achClose">关闭</button></div>
    </div>
  </div>
  <script>
    (function(){
      var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
      var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));
      var countEl = document.getElementById('count');
      var search = document.getElementById('search');
      var curF = 'all', curQ = '';
      var grid = document.querySelector('.grid');
      var sortSel = document.getElementById('sort');
      function sortCards(mode){
        if(mode==='def'){ cards.forEach(function(c){ grid.appendChild(c); }); return; }
        var arr = cards.slice();
        arr.sort(function(a,b){
          if(mode==='name') return (a.querySelector('h2').textContent||'').localeCompare(b.querySelector('h2').textContent||'','zh');
          if(mode==='tag') return (a.querySelector('.tag').textContent||'').localeCompare(b.querySelector('.tag').textContent||'','zh');
          return 0;
        });
        arr.forEach(function(c){ grid.appendChild(c); });
      }
      var RECENT_KEY = 'hub_recent';
      var recent = [];
      try { recent = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch(e) { recent = []; }
      function pushRecent(href){
        recent = recent.filter(function(h){ return h !== href; });
        recent.unshift(href);
        if (recent.length > 8) recent = recent.slice(0, 8);
        try { localStorage.setItem(RECENT_KEY, JSON.stringify(recent)); } catch(e) {}
      }
      var FAV_KEY='hub_fav';
      function favSet(){ try{ return JSON.parse(localStorage.getItem(FAV_KEY)||'[]'); }catch(e){ return []; } }
      function toggleFav(href, star){
        var s=favSet(); var i=s.indexOf(href);
        if(i>=0){ s.splice(i,1); star.classList.remove('on'); star.textContent='☆'; }
        else { s.push(href); star.classList.add('on'); star.textContent='★'; }
        try{ localStorage.setItem(FAV_KEY, JSON.stringify(s)); }catch(e){}
        if(curF==='fav') apply();
      }
      cards.forEach(function(c){
        var star=document.createElement('span'); star.className='star'; star.textContent='☆'; star.title='收藏';
        if(favSet().indexOf(c.getAttribute('href'))>=0){ star.classList.add('on'); star.textContent='★'; }
        star.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); toggleFav(c.getAttribute('href'), star); });
        c.appendChild(star);
      });
      function apply(){
        var n = 0, q = curQ.trim().toLowerCase();
        cards.forEach(function(c){
          var f = curF;
          var byCat = (f==='all') ? true : (f==='recent' ? recent.indexOf(c.getAttribute('href'))>=0 : (f==='fav' ? favSet().indexOf(c.getAttribute('href'))>=0 : c.getAttribute('data-cat')===f));
          var byQ = !q || (c.textContent||'').toLowerCase().indexOf(q) >= 0;
          if(recent.indexOf(c.getAttribute('href'))>=0) c.classList.add('played'); else c.classList.remove('played');
          if(byCat && byQ){ c.classList.remove('hide'); n++; } else { c.classList.add('hide'); }
        });
        if(countEl) countEl.textContent = '显示 '+n+' 款';
      }
      chips.forEach(function(ch){
        ch.addEventListener('click', function(){
          chips.forEach(function(x){ x.classList.remove('active'); });
          ch.classList.add('active');
          curF = ch.getAttribute('data-f'); apply();
        });
      });
      if(search){ search.addEventListener('input', function(){ curQ = search.value; apply(); }); }
      if(sortSel){ sortSel.addEventListener('change', function(){ sortCards(sortSel.value); }); }
      var MUTE_KEY='hub_mute';
      var muteBtn=document.getElementById('mute');
      var muted=false;
      try { muted = localStorage.getItem(MUTE_KEY)==='1'; } catch(e) {}
      function applyMute(){
        if(window.Juice) window.Juice.setMuted(muted);
        if(muteBtn){ muteBtn.textContent = muted ? '🔇 静音' : '🔊 音效'; muteBtn.classList.toggle('off', muted); }
      }
      if(muteBtn){ muteBtn.addEventListener('click', function(){ muted=!muted; try{ localStorage.setItem(MUTE_KEY, muted?'1':'0'); }catch(e){} applyMute(); }); }
      applyMute();
      cards.forEach(function(c){ c.addEventListener('click', function(){ pushRecent(c.getAttribute('href')); }); });
      var rnd = document.getElementById('rnd');
      if(rnd){ rnd.addEventListener('click', function(){
        var vis = cards.filter(function(c){ return !c.classList.contains('hide'); });
        if(vis.length){ var pick = vis[Math.floor(Math.random()*vis.length)]; pushRecent(pick.getAttribute('href')); location.href = pick.getAttribute('href'); }
      }); }
      document.addEventListener('keydown', function(e){
        if(e.key==='/' && document.activeElement!==search){ e.preventDefault(); search.focus(); }
        if(e.key==='Escape' && document.activeElement===search){ search.value=''; curQ=''; apply(); search.blur(); }
      });
      var topBtn=document.getElementById('top');
      if(topBtn){ var onScroll=function(){ if(window.scrollY>400) topBtn.classList.add('show'); else topBtn.classList.remove('show'); }; window.addEventListener('scroll', onScroll); onScroll();
        topBtn.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); }); }
      apply();
      var tc = document.getElementById('totCount');
      if(tc) tc.textContent = '共 '+cards.length+' 款游戏';

      // ===== E. 大厅增强：详情弹窗 / 设置 / 成就图鉴 / 键盘导航 / 统计 =====
      // 详情弹窗（点卡片弹窗代替直跳）
      var detailModal=document.getElementById('detailModal');
      function openDetail(c){
        var href=c.getAttribute('href');
        var h2=c.querySelector('h2'), dsc=c.querySelector('.desc'), key=c.querySelector('.key');
        document.getElementById('dmTitle').textContent = h2?h2.textContent:'';
        document.getElementById('dmDesc').textContent = dsc?dsc.textContent:'';
        document.getElementById('dmOps').textContent = key?key.textContent:'';
        document.getElementById('dmPlay').setAttribute('href', href);
        detailModal.classList.add('show');
      }
      function closeDetail(){ detailModal.classList.remove('show'); }
      document.getElementById('dmClose').addEventListener('click', closeDetail);
      detailModal.addEventListener('click', function(e){ if(e.target===detailModal) closeDetail(); });
      cards.forEach(function(c){ c.addEventListener('click', function(e){ e.preventDefault(); openDetail(c); }); });

      // 设置面板
      var setModal=document.getElementById('setModal');
      var SW_RM='hub_reduced', SW_ANIM='hub_anim', VOL_KEY='hub_vol';
      var swRM=document.getElementById('swRM'), swAnim=document.getElementById('swAnim'), volRange=document.getElementById('volRange');
      function applySettings(){
        var rm=localStorage.getItem(SW_RM)==='1', an=localStorage.getItem(SW_ANIM)!=='0', vol=parseInt(localStorage.getItem(VOL_KEY)||'70',10);
        document.body.classList.toggle('reduced-motion', rm);
        document.body.classList.toggle('no-anim', !an);
        swRM.classList.toggle('on', rm); swAnim.classList.toggle('on', an);
        volRange.value=vol;
        if(window.Juice && window.Juice.setVolume) window.Juice.setVolume(vol/100);
      }
      swRM.addEventListener('click', function(){ localStorage.setItem(SW_RM, swRM.classList.contains('on')?'0':'1'); applySettings(); });
      swAnim.addEventListener('click', function(){ localStorage.setItem(SW_ANIM, swAnim.classList.contains('on')?'0':'1'); applySettings(); });
      volRange.addEventListener('input', function(){ localStorage.setItem(VOL_KEY, volRange.value); applySettings(); });
      document.getElementById('setBtn').addEventListener('click', function(){ applySettings(); setModal.classList.add('show'); });
      document.getElementById('setClose').addEventListener('click', function(){ setModal.classList.remove('show'); });
      setModal.addEventListener('click', function(e){ if(e.target===setModal) setModal.classList.remove('show'); });
      applySettings();

      // 成就图鉴（静态目录）
      var achModal=document.getElementById('achModal');
      var ACH=[['连胜达人','在任意游戏中连续取胜 3 次'],['速通达人','在 60 秒内通关一款解谜游戏'],['高分王者','刷新任意游戏的最佳分纪录'],['段位宗师','Juice 段位达到「宗师」'],['收藏家','将 10 款游戏加入收藏'],['全图鉴','打通一款逻辑谜题（数回/珍珠/数灯…）'],['街机之神','在街机动作游戏中触发一次 TETRIS 级连击'],['道具大师','单局拾取 5 个掉落增益']];
      (function(){
        var groups={'操作类':ACH.slice(0,4),'收集类':ACH.slice(4)}, html='';
        for(var g in groups){ html+='<div class="ach-group"><b>'+g+'</b>'; groups[g].forEach(function(a){ html+='<div class="ach-item"><span class="a">◆</span><span>'+a[0]+' — '+a[1]+'</span></div>'; }); html+='</div>'; }
        document.getElementById('achBody').innerHTML=html;
      })();
      document.getElementById('achBtn').addEventListener('click', function(){ achModal.classList.add('show'); });
      document.getElementById('achClose').addEventListener('click', function(){ achModal.classList.remove('show'); });
      achModal.addEventListener('click', function(e){ if(e.target===achModal) achModal.classList.remove('show'); });

      // 键盘卡片导航
      var focusIdx=-1;
      function focusCard(i){
        var vis=cards.filter(function(c){ return !c.classList.contains('hide'); });
        if(!vis.length) return;
        if(i<0) i=0; if(i>=vis.length) i=vis.length-1;
        if(focusIdx>=0 && vis[focusIdx]) vis[focusIdx].classList.remove('kfocus');
        focusIdx=i; vis[i].classList.add('kfocus'); vis[i].scrollIntoView({block:'nearest'});
      }
      document.addEventListener('keydown', function(e){
        if(detailModal.classList.contains('show')||setModal.classList.contains('show')||achModal.classList.contains('show')){ if(e.key==='Escape'){ closeDetail(); setModal.classList.remove('show'); achModal.classList.remove('show'); } return; }
        var vis=cards.filter(function(c){ return !c.classList.contains('hide'); });
        var step=Math.max(1, Math.floor(Math.sqrt(vis.length/2)));
        if(e.key==='ArrowRight'){ e.preventDefault(); focusCard(focusIdx+1); }
        else if(e.key==='ArrowLeft'){ e.preventDefault(); focusCard(focusIdx-1); }
        else if(e.key==='ArrowDown'){ e.preventDefault(); focusCard(focusIdx+step); }
        else if(e.key==='ArrowUp'){ e.preventDefault(); focusCard(focusIdx-step); }
        else if(e.key==='Enter' && focusIdx>=0 && vis[focusIdx]){ e.preventDefault(); openDetail(vis[focusIdx]); }
      });

      // 页脚动态统计
      (function(){
        var total=cards.length, multi=0, neu=0;
        cards.forEach(function(c){ if(c.getAttribute('data-cat')==='multi') multi++; if(c.querySelector('.newflag')) neu++; });
        if(tc) tc.textContent='共 '+total+' 款 · 单人 '+(total-multi)+' · 多人/联机 '+multi+' · 新增 '+neu;
      })();
    })();
  </script>
</body>
</html>
